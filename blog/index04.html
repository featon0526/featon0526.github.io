<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人知识库</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .article-list {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }

        .article-list ul {
            list-style: none;
            padding: 0;
        }

        .article-list li {
            margin-bottom: 10px;
        }

        .article-list a {
            color: #333;
            text-decoration: none;
        }

        .article-list a:hover {
            color: #007bff;
        }

        .article-content h1 {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .article-content .meta {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .article-content .content {
            line-height: 1.8;
            color: #333;
        }

        .knowledge-card {
            border: 1px solid #eee;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .knowledge-card:hover {
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container">
            <a class="navbar-brand" href="https://featon0526.github.io/index.html">个人知识库</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index03.html">笔记</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index04.html">项目</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index05.html">资源</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="搜索知识...">
                    <button class="btn btn-outline-primary" type="submit">搜索</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- 主要内容区 -->
    <div class="container" style="margin-top: 80px;">
        <div class="row">
            <!-- 左侧分类导航 -->
            <div class="col-md-3">
                <div class="article-list">
                    <h4>项目经验</h4>
                    <ul>
                        <li><a href="#">项目经验1</a></li>
                        <li><a href="#">项目经验2</a></li>
                        <li><a href="#">项目经验3</a></li>
                        <li><a href="#">项目经验4</a></li>
                        <li><a href="#">项目经验5</a></li>
                    </ul>
                </div>
            </div>

            <!-- 右侧内容展示 -->
            <div class="col-md-9">
                <!-- 知识卡片区域 -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="knowledge-card w-100">
                            <canvas id="weightChart"></canvas>
                            <script src="https://cdn.staticfile.net/Chart.js/3.9.1/chart.js"></script>
                            <script>
                                const ctx = document.getElementById('weightChart');
                                
                                new Chart(ctx, {
                                    type: 'line',
                                    data: {
                                        labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                                        datasets: [{
                                            label: '体重 (kg)',
                                            data: [75, 74, 73.5, 72, 71, 70, 69, 68.5, 68, 67.5, 67, 66.5],
                                            borderColor: 'rgb(75, 192, 192)',
                                            tension: 0.1,
                                            fill: false
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        plugins: {
                                            title: {
                                                display: true,
                                                text: '2024年体重变化曲线',
                                                font: {
                                                    size: 16
                                                }
                                            },
                                            legend: {
                                                position: 'bottom'
                                            }
                                        },
                                        scales: {
                                            y: {
                                                beginAtZero: false,
                                                title: {
                                                    display: true,
                                                    text: '体重 (kg)'
                                                }
                                            },
                                            x: {
                                                title: {
                                                    display: true,
                                                    text: '月份'
                                                }
                                            }
                                        }
                                    }
                                });
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-light py-4 mt-1">
        <div class="container text-center">
            <p class="mb-0">© 2024 个人知识库. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS 和依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
