<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新媒体交互设计 · 课程介绍</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --accent:#2F5AFF; --accent-2:#7A5AF8;
    --ink:#0E1A2E; --ink-2:rgba(14,26,46,.62); --ink-3:rgba(14,26,46,.42);
    --paper:#FFFFFF; --bg:#F4F7FE; --line:#E3E9F6;
    --radius:20px;
    --shadow-lg:0 24px 60px -18px rgba(23,48,110,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans SC",system-ui,sans-serif;
    color:var(--ink); background:var(--bg);
    min-height:100vh;
    background-image:
      radial-gradient(900px 420px at 82% -10%, rgba(47,90,255,.10), transparent 60%),
      radial-gradient(700px 380px at 8% 110%, rgba(122,90,248,.08), transparent 60%);
  }
  .wrap{max-width:980px;margin:0 auto;padding:40px 24px 64px}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;margin-bottom:34px;
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:17px}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.5px;
  }
  .brand .tag{
    font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--accent);
    background:rgba(47,90,255,.08);border:1px solid rgba(47,90,255,.16);
    padding:3px 10px;border-radius:999px;
  }
  .nav-links a{
    color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500;
    margin-left:18px;transition:color .2s;
  }
  .nav-links a:hover{color:var(--accent)}
  .hero h1{font-size:clamp(28px,4.5vw,44px);font-weight:900;line-height:1.18;letter-spacing:-.5px}
  .hero h1 .hl{color:var(--accent)}
  .hero p{margin-top:14px;color:var(--ink-2);font-size:15px;line-height:1.8;max-width:640px}
  .video-card{
    margin-top:28px;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;
  }
  .video-frame{
    position:relative;background:#0b1526;aspect-ratio:16/9;
  }
  .video-frame video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  }
  .video-meta{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 22px;flex-wrap:wrap;
  }
  .video-meta .t{font-weight:700;font-size:16px}
  .video-meta .s{color:var(--ink-3);font-size:13px;margin-top:3px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);color:#fff;text-decoration:none;
    padding:10px 20px;border-radius:11px;font-size:14px;font-weight:600;
    transition:transform .15s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -8px rgba(47,90,255,.55)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(47,90,255,.25)}
  .foot{margin-top:34px;color:var(--ink-3);font-size:13px;text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="logo">IXD</span>
        <span>新媒体交互设计</span>
        <span class="tag">2026</span>
      </div>
      <nav class="nav-links">
        <a href="https://nwu-newmedia-2026.pages.dev/index.html#works">学生作品</a>
        <a href="https://nwu-newmedia-2026.pages.dev/index.html#about">关于课程</a>
      </nav>
    </div>

    <header class="hero">
      <h1>课程介绍视频<br><span class="hl">新媒体交互设计</span></h1>
      <p>本课程从个人网页到交互应用，带同学们用 HTML、CSS 与 JavaScript 一步步搭建可运行的创意表达。下方为课程介绍短片。</p>
    </header>

    <div class="video-card">
      <div class="video-frame">
        <video src="course_intro.mp4" controls autoplay muted playsinline preload="metadata"></video>
      </div>
      <div class="video-meta">
        <div>
          <div class="t">课程介绍 · Course Intro</div>
          <div class="s">点击播放按钮观看，可全屏</div>
        </div>
        <a class="btn" href="https://nwu-newmedia-2026.pages.dev/index.html">浏览学生作品 →</a>
      </div>
    </div>

    <p class="foot">网络新媒体专业课程作业展示 · 新媒体交互设计 2026</p>
  </div>
</body>
</html>
